# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@v2026-06-15
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Run checks
        run: nix flake check
name: Check
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
