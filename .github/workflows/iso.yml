name: Build ISO Image

on:
  push:
    branches: 
      - main

  workflow_dispatch:

concurrency:
  group: "iso"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@v2026-06-15
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build ISO package
        run: nix build .#nixosConfigurations.LiAlH4-LiveCD.config.system.build.isoImage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: result/iso/*.iso
          if-no-file-found: error
          compression-level: 0
          archive: false
